# Демо сайта на GitHub Pages: примеры новостей из site/src/sample, noindex.
# Репозиторий в GitVerse - основной, здесь (в зеркале GitHub) workflow публикует
# site/dist как GitHub Pages. В GitVerse шаги пропускаются (guard по server_url).
# Включение: в GitHub Настройки -> Pages -> Source: GitHub Actions.
name: Demo on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Основной репозиторий - GitVerse, этот workflow нужен только там, где он
    # запускается GitHub'ом: у GitVerse свои экшены в .gitverse/workflows/pages.yml.
    if: startsWith(github.server_url, 'https://github.com')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install
        run: npm ci
        working-directory: site

      - name: Build
        run: npm run build
        working-directory: site
        env:
          SITE_ENV: staging
          SITE_URL: https://yourdisenchantment.github.io
          SITE_BASE: /dobromir

      - name: Upload pages artifact
        # v5 внутри использует upload-artifact v7 (Node 24); v3 тянул v4 - предупреждение.
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    # Токен публикации здесь выдает сам GitHub. Актуальные major-версии экшенов
    # (на ноябрь 2026): checkout/setup-node/upload-pages-artifact - v7/v7/v5,
    # у них рантайм на Node 24; v3 upload-pages-artifact тянул upload-artifact v4
    # и давал предупреждение про устаревший Node 20.
    needs: build
    if: startsWith(github.server_url, 'https://github.com')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
