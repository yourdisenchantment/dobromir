[project]
name = "dobromir-pipeline"
version = "0.0.0"
description = "Сбор контента из VK для сайта Добромир: fetch, parse, export, уведомления"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "pillow",
    "pydantic",
    # База часовых поясов для zoneinfo: на хосте ее наличие не проверено.
    "tzdata",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
# На хосте Beget Python 3.10: ruff не должен предлагать синтаксис 3.11+.
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Кириллица в строках и комментариях - норма, ruff принимает ее за "похожие символы".
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Предупреждение - это ошибка, опечатка в маркере - тоже.
addopts = "--strict-markers"
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "commitizen",
    "mypy",
    "pre-commit",
    "pytest",
    "ruff",
]
