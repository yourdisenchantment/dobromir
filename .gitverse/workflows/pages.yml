# Демо сайта на GitVerse Pages: примеры новостей из src/sample, noindex.
# Включение: Настройки -> Страницы -> Источник -> Воркфлоу.
name: Demo Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: npm ci
        working-directory: site

      - name: Build
        run: npm run build
        working-directory: site
        env:
          SITE_ENV: staging
          SITE_URL: https://yourdisenchantment.gitverse.site
          SITE_BASE: /dobromir

      - name: Upload pages artifact
        uses: gitverse/upload-pages-artifact@v1.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: gitverse/deploy-pages@v1.0.0
